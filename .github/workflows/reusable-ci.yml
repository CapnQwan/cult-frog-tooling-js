name: Reusable CI

# Shared CI pipeline for Cult Frog packages. Consumed via `workflow_call`, e.g.
#   jobs:
#     check:
#       uses: CapnQwan/cult-frog-tooling-js/.github/workflows/reusable-ci.yml@main

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to run the checks on.
        type: string
        required: false
        default: "20.19"
      run-build:
        description: Whether to run the package build step.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm check:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        if: ${{ inputs.run-build }}
        run: pnpm build
